<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="formulario.css">

</head>
<body>
     <div class="titulo">
        <h1>Formulario de Bicis</h1>
            

    </div>

    <form action="">

        <fieldset class="datos">
            <legend>Datos Personales</legend>
            
            <fieldset class="nombres">
                <label for="nombre">Nombres:</label>
                <input type="text" name="nombre" id="nombre">
                <br>

                <br>
                <label for="apellido">Apellidos:</label>
                <input type="text" name="apellido" id="apellido">
            </fieldset>
        

            <fieldset class="nombres">
                <legend>Tu Bici Ideal</legend>

                <label for="bici">¿Que tipo de Bicicleta buscas?</label>
                <br>
                <select name="bici" id="bici">
                    <option value="Montañera">Montañera</option>
                    <option value="monociclo-de-circo">Monociclo-de-Circo</option>
                    <option value="Barbie">Sorpresa</option>
                    <option value="stunt">Puro Freseo</option>
                    <option value="Normal">Normal</option>
                </select>
                <br>

                <br>
                <label for="presupuesto">¿Qué presupuesto tienes?</label>
                <select name="presupuesto" id="presupuesto">
                    <option value="0-100">0-100$</option>
                    <option value="100-500">100-500$</option>
                    <option value="mucho">Aqui lo que sobra es billete...</option>
                </select>

            </fieldset>


            
        </fieldset>
        

    </form>

    <p><a href="index.html">Volver al inicio</a></p>

</body>
</html>
